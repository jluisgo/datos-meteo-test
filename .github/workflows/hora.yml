name: Test hora
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escribir JSON con la hora
        run: |
          mkdir -p data
          echo "{\"actualizado\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/hora.json
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/hora.json
          git commit -m "Actualiza hora" || exit 0
          git push
