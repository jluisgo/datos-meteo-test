name: Test Copernicus
on:
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramienta
        run: pip install copernicusmarine
      - name: Describir dataset horario
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          copernicusmarine describe --dataset-id cmems_mod_glo_phy_anfc_merged-uv_PT1H-i > salida.json
          grep -E '"(short_name|standard_name|coordinate_id|minimum_value|maximum_value)"' salida.json | head -60
